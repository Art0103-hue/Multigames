<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QU!Z - Jogo de Perguntas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/screens.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ==================== WELCOME SCREEN ==================== -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-container">
            <div class="logo-box">
                <div class="logo-text">
                    <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                    <span class="star">&#9733;</span>
                </div>
                <div class="question-mark">?</div>
            </div>
            <button class="btn-enter" id="btn-enter">Entre</button>
        </div>
    </div>

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="screen-login" class="screen">
        <div class="login-container">
            <div class="logo-box">
                <div class="logo-text">
                    <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                    <span class="star">&#9733;</span>
                </div>
                <div class="question-mark">?</div>
            </div>
            <div class="login-label">Login:</div>
            <div class="form-box">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" placeholder="********">
                </div>
            </div>
            <button class="btn-arrow-right" id="btn-login-submit">&#8594;</button>
            <div class="link-text" id="link-register">Não tem conta? <span class="link-highlight">Cadastre-se</span></div>
        </div>
    </div>

    <!-- ==================== REGISTER SCREEN ==================== -->
    <div id="screen-register" class="screen">
        <div class="register-container">
            <div class="logo-box">
                <div class="logo-text">
                    <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                    <span class="star">&#9733;</span>
                </div>
                <div class="question-mark">?</div>
            </div>
            <div class="form-title">Preencha seus dados</div>
            <div class="form-box register-form-box">
                <div class="form-group">
                    <label for="reg-nome">Nome:</label>
                    <input type="text" id="reg-nome" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email:</label>
                    <input type="email" id="reg-email" placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="reg-senha">Senha:</label>
                    <input type="password" id="reg-senha" placeholder="********">
                </div>
            </div>
            <div class="terms-check">
                <input type="checkbox" id="terms-checkbox">
                <label for="terms-checkbox">Declaro estar ciente e que aceito os <span class="link-highlight">Termos de Uso</span> e <span class="link-highlight">Política de Privacidade</span></label>
            </div>
            <button class="btn-arrow-right" id="btn-register-submit">&#8594;</button>
        </div>
    </div>

    <!-- ==================== SPIN WHEEL SCREEN ==================== -->
    <div id="screen-wheel" class="screen">
        <div class="wheel-container">
            <div class="logo-box small-logo">
                <div class="logo-text">
                    <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                    <span class="star">&#9733;</span>
                </div>
                <div class="question-mark">?</div>
            </div>
            <div class="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <canvas id="wheel-canvas" width="300" height="300"></canvas>
            </div>
            <button class="btn-spin" id="btn-spin">Girar</button>
        </div>
    </div>

    <!-- ==================== QUIZ SCREEN ==================== -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-container">
            <div class="quiz-header">
                <div class="quiz-pergunta" id="quiz-pergunta-label">Pergunta 1/5</div>
                <div class="logo-box small-logo">
                    <div class="logo-text">
                        <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                        <span class="star">&#9733;</span>
                    </div>
                    <div class="question-mark">?</div>
                </div>
            </div>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-step active" data-step="1">1</div>
                <div class="progress-line"></div>
                <div class="progress-step" data-step="2">2</div>
                <div class="progress-line"></div>
                <div class="progress-step" data-step="3">3</div>
                <div class="progress-line"></div>
                <div class="progress-step" data-step="4">4</div>
                <div class="progress-line"></div>
                <div class="progress-step" data-step="5">5</div>
            </div>
            <div class="quiz-question-box">
                <p id="quiz-question-text"></p>
            </div>
            <div class="quiz-options" id="quiz-options">
                <button class="quiz-option" data-index="0"><span class="option-letter">A)</span> <span class="option-text"></span></button>
                <button class="quiz-option" data-index="1"><span class="option-letter">B)</span> <span class="option-text"></span></button>
                <button class="quiz-option" data-index="2"><span class="option-letter">C)</span> <span class="option-text"></span></button>
                <button class="quiz-option" data-index="3"><span class="option-letter">D)</span> <span class="option-text"></span></button>
            </div>
            <div class="quiz-navigation">
                <button class="btn-nav btn-prev" id="btn-prev">&#8592;</button>
                <button class="btn-nav btn-next" id="btn-next">&#8594;</button>
            </div>
        </div>
    </div>

    <!-- ==================== RESULT SCREEN ==================== -->
    <div id="screen-result" class="screen">
        <div class="result-container">
            <div class="logo-box">
                <div class="logo-text">
                    <span class="letter-q">Q</span><span class="letter-u">U</span><span class="letter-i">!</span><span class="letter-z">Z</span>
                    <span class="star">&#9733;</span>
                </div>
                <div class="question-mark">?</div>
            </div>
            <div class="result-title">Resultado</div>
            <div class="result-score-box">
                <div class="result-score-label">Pontuação</div>
                <div class="result-score-value" id="result-score">0</div>
            </div>
            <div class="result-details" id="result-details"></div>
            <button class="btn-enter" id="btn-play-again">Jogar Novamente</button>
        </div>
    </div>

    <!-- ==================== FEEDBACK MODAL ==================== -->
    <div id="feedback-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon" id="feedback-icon"></div>
            <div class="modal-text" id="feedback-text"></div>
            <button class="btn-modal-ok" id="btn-feedback-ok">OK</button>
        </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
